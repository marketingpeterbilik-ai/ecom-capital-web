<!-- @dsCard group="Colors" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#FFFFFF;color:#17171B;padding:32px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .swatch{border:1px solid rgba(23,23,27,.12);border-radius:14px;overflow:hidden;}
  .fill{height:88px;}
  .meta{padding:12px 14px;}
  .name{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;}
  .hex{font-family:'JetBrains Mono',monospace;font-size:11px;color:#5A5B63;margin-top:4px;}
</style>
</head>
<body>
  <div class="grid">
    <div class="swatch"><div class="fill" style="background:#3826F3;"></div><div class="meta"><div class="name">Indigo</div><div class="hex">#3826F3 · primárna</div></div></div>
    <div class="swatch"><div class="fill" style="background:#C7F541;"></div><div class="meta"><div class="name">Lime</div><div class="hex">#C7F541 · akcent (10%)</div></div></div>
    <div class="swatch"><div class="fill" style="background:#17171B;"></div><div class="meta"><div class="name">Ink</div><div class="hex">#17171B · text</div></div></div>
    <div class="swatch"><div class="fill" style="background:#2A1CC8;"></div><div class="meta"><div class="name">Indigo deep</div><div class="hex">#2A1CC8 · hover</div></div></div>
    <div class="swatch"><div class="fill" style="background:#5A5B63;"></div><div class="meta"><div class="name">Slate</div><div class="hex">#5A5B63 · sek. text</div></div></div>
    <div class="swatch"><div class="fill" style="background:#F2F1FA;"></div><div class="meta"><div class="name">Mist</div><div class="hex">#F2F1FA · pozadie</div></div></div>
  </div>
</body>
</html>
