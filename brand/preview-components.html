<!-- @dsCard group="Components" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#FFFFFF;padding:32px;}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:20px;}
  .btn{font-family:'Sora',sans-serif;font-weight:600;font-size:14px;padding:13px 24px;border-radius:999px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 15px;border-radius:999px;}
  .card{background:#FFFFFF;border:1px solid rgba(23,23,27,.12);border-radius:16px;box-shadow:0 10px 30px rgba(23,23,27,.07);padding:16px;max-width:280px;}
</style>
</head>
<body>
  <div class="row">
    <span class="btn" style="background:#C7F541;color:#17171B;">Rezervovať konzultáciu →</span>
    <span class="btn" style="background:#3826F3;color:#FFFFFF;">Konzultácia →</span>
    <span class="btn" style="background:transparent;color:#3826F3;border:1.5px solid #3826F3;padding:11.5px 24px;">Zobraziť služby</span>
  </div>
  <div class="row">
    <span class="badge" style="background:#C7F541;color:#17171B;">Meranie v cene · bez viazanosti</span>
    <span class="badge" style="background:#EFEDFE;color:#3826F3;">PPC · GA4 · BigQuery</span>
  </div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;"><span style="width:26px;height:26px;border-radius:8px;background:#C7F541;flex:none;"></span><span style="font-family:'Sora',sans-serif;font-weight:600;font-size:14px;">Meranie v cene správy</span></div>
  </div>
</body>
</html>
